[project]
name = "hr-ops-agent"
version = "1.0.0"
description = "Claude-native HR operations agent — tool-use orchestration over synthetic HR knowledge base"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "streamlit>=1.40.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "flagembedding>=1.2.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "langfuse>=2.0.0,<3.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["eval/", "workflows/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "garak>=0.15.0",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
]
# Optional: install for Langfuse tracing.
# uv sync --group observability
observability = [
    "langfuse>=2.0.0",
]
